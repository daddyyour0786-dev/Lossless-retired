name: Build signed Lossless release APK

# Optional, and separate from android-debug.yml on purpose: this one runs R8,
# which is the difference between an APK that scrolls smoothly and one that
# doesn't. The debug workflow stays as it was, so if this one trips over a keep
# rule the debug build is untouched.
#
# Needs the same two repository secrets as the debug workflow
# (LSY_FREE_KEYSTORE_BASE64, LSY_FREE_KEYSTORE_PASSWORD). The keystore they hold
# is a PKCS12 whose key alias is `lsy-free` — the pre-rebrand spelling, kept
# because the key already exists and changing it would change the signature
# every install was signed with.
#
# ### Versioning
#
# Every run publishes a *new* version, so the number in the app actually moves:
#
#   0.1.0 -> 0.1.1 -> 0.1.2 -> ...
#
# The version is read from the tag of the newest existing release and the patch
# component bumped, which keeps the published tag, the APK's own versionName,
# the file name and the in-app update prompt in agreement. The first run, with
# no releases yet, cuts 0.1.0.
#
# versionCode is derived from the same number as `major*10000 + minor*100 +
# patch`, so it always climbs as the version does — Android refuses to install
# an update whose versionCode is lower than the one already on the device.
#
# Pass a version to the workflow by hand to cut something other than the next
# patch (a minor or a fix release); leave it blank for the automatic bump.
#
# ### Release notes
#
# The published body is generated from the commits between the previous
# release's tag and the commit being built — so the notes describe what
# actually changed in the repository, with no separate file to keep in step.
# The in-app update prompt renders that body as Markdown (see
# `UpdateAvailableDialog`), which is what puts the same list in front of a
# listener before they download.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0). Leave blank to bump the patch automatically.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default single commit: the notes are built
          # with `git log <previous tag>..HEAD`, which needs both ends of that
          # range on disk. The tags come along with it.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle signing config reads keystore.properties from the project
      # root; it and the keystore are both gitignored, so they only exist for
      # the length of this job.
      - name: Stage the signing key
        env:
          LSY_FREE_KEYSTORE_BASE64: ${{ secrets.LSY_FREE_KEYSTORE_BASE64 }}
          LSY_FREE_KEYSTORE_PASSWORD: ${{ secrets.LSY_FREE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$LSY_FREE_KEYSTORE_BASE64" ] || [ -z "$LSY_FREE_KEYSTORE_PASSWORD" ]; then
            echo '::error::Add LSY_FREE_KEYSTORE_BASE64 and LSY_FREE_KEYSTORE_PASSWORD as repository Actions secrets before building.'
            exit 1
          fi
          umask 077
          printf '%s' "$LSY_FREE_KEYSTORE_BASE64" | base64 --decode > lossless-ci.p12
          keytool -list -keystore lossless-ci.p12 -storetype PKCS12 -alias lsy-free \
            -storepass:env LSY_FREE_KEYSTORE_PASSWORD > /dev/null
          {
            echo 'storeFile=lossless-ci.p12'
            echo "storePassword=$LSY_FREE_KEYSTORE_PASSWORD"
            echo 'keyAlias=lsy-free'
            echo "keyPassword=$LSY_FREE_KEYSTORE_PASSWORD"
          } > keystore.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDKs and native tools
        run: |
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

      # The version this run will publish. Everything downstream reads it from
      # here — the Gradle build, the APK names and the git tag.
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Newest published release decides what "next" means, and is also the
          # left-hand end of the release-notes range below. `--jq` on an empty
          # list yields nothing, which is how the first release gets 0.1.0
          # rather than an error.
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name // empty' 2>/dev/null || true)"
          fi

          if [ -n "${REQUESTED:-}" ]; then
            version="${REQUESTED#v}"
            echo "Publishing the requested version $version."
          else
            version="$(python3 - "$latest" <<'PY'
          import sys
          raw = (sys.argv[1] if len(sys.argv) > 1 else "").strip().lstrip("v")
          base = raw.split("-")[0] if raw else ""
          parts = (base.split(".") + ["0", "0", "0"])[:3] if base else []
          try:
              major, minor, patch = (int(p) for p in parts)
          except (ValueError, TypeError):
              major, minor, patch = 0, 1, -1
          print(f"{major}.{minor}.{patch + 1}")
          PY
            )"
            echo "Previous release: '${latest:-none}'. Publishing $version."
          fi
          echo "Notes will cover commits since '${latest:-the first commit}'."

          # Android needs a monotonic integer; major*10000+minor*100+patch
          # leaves room for 9999 patches per minor.
          code="$(python3 -c "a,b,c=(int(x) for x in '$version'.split('.')); print(a*10000+b*100+c)")"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "### Publishing \`v$version\` (versionCode $code)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build a signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease \
            --no-daemon --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Verify the signature
        env:
          LSY_FREE_KEYSTORE_PASSWORD: ${{ secrets.LSY_FREE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/prod/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo '::error::No APKs were generated.'
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      # The in-app updater looks for assets named `Lossless-*.apk`, preferring
      # the universal build and falling back to the split matching the device's
      # ABI — see AppUpdateChecker.apkAssetUrl. So the names here are part of
      # the contract, not a convenience: the universal APK carries no ABI
      # suffix, and each split carries `_<abi>`.
      - name: Stage the release assets
        id: stage
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          shopt -s nullglob
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            name="$(basename "$apk")"
            suffix=""
            case "$name" in
              *universal*) suffix="" ;;
              *arm64-v8a*) suffix="_arm64-v8a" ;;
              *armeabi-v7a*) suffix="_armeabi-v7a" ;;
              *x86_64*) suffix="_x86_64" ;;
              *) suffix="" ;;
            esac
            cp "$apk" "dist/Lossless-v${version}${suffix}.apk"
          done
          ls -lh dist
          if [ -z "$(ls -A dist)" ]; then
            echo '::error::Nothing was staged for release.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lossless-release-APKs
          path: dist/*.apk
          if-no-files-found: error

      # The body every listener reads before downloading, assembled from the
      # repository itself: one bullet per commit since the previous release's
      # tag. Nothing to maintain alongside the code, and nothing that can
      # disagree with what is actually in the build.
      #
      # `UpdateAvailableDialog` renders this as Markdown, so the same list
      # shows up in the in-app prompt.
      - name: Compose the release notes
        id: notes
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          file="release-notes.md"

          # Drop merge commits — "Merge branch 'main'" describes the repo's
          # paperwork, not a change — and anything that only ever touches CI
          # bookkeeping is still shown, because a listener looking at a build
          # with no app changes deserves to see why it exists.
          range=""
          if [ -n "${PREVIOUS:-}" ] && git rev-parse -q --verify "refs/tags/${PREVIOUS}" >/dev/null; then
            # A force-push can leave the old tag off this branch's history, in
            # which case a range from it would either fail or list the whole
            # repo. Only take the range when it is genuinely an ancestor.
            if git merge-base --is-ancestor "refs/tags/${PREVIOUS}" HEAD; then
              range="${PREVIOUS}..HEAD"
            else
              echo "::warning::${PREVIOUS} is not an ancestor of ${GITHUB_SHA}; listing recent commits instead."
            fi
          fi

          # Subject lines only. The hash of each commit is a detail for the
          # compare link to answer, not something a listener reading "what's
          # new" before downloading a music app needs beside every bullet.
          if [ -n "$range" ]; then
            commits="$(git log --no-merges --pretty=format:'- %s' "$range" | head -n 60 || true)"
          else
            commits="$(git log --no-merges --pretty=format:'- %s' HEAD | head -n 20 || true)"
          fi
          [ -n "$commits" ] || commits="- No commits since the previous release."

          # Kept to what the reader needs before pressing download: what
          # changed, and a way to see the diff. No "built from <sha> · <date>"
          # trailer and no sentence about the in-app prompt — the page already
          # shows the date, and that sentence was sitting inside the in-app
          # update prompt describing the in-app update prompt.
          #
          # Syntax is CommonMark only — headings, bullets, emphasis, links
          # with a label, inline code. The in-app dialog renders this body with
          # compose-richtext's commonmark flavour, which does not do raw HTML,
          # and a bare URL is far less readable there than a short link label.
          if [ -n "$range" ]; then
            changelog="[Full changelog](https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...v${VERSION})"
          else
            # Only when the range was real: a compare link across a tag that
            # is not on this history would offer a diff of two unrelated trees.
            changelog=""
          fi

          {
            echo "## What's new in ${VERSION}"
            echo
            echo "$commits"
            echo
            if [ -n "$changelog" ]; then
              echo "${changelog} · \`${GITHUB_SHA:0:7}\`"
            else
              echo "\`${GITHUB_SHA:0:7}\`"
            fi
          } > "$file"

          echo "$(wc -l < "$file") lines of notes composed."
          cat "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # Publishing is the half that makes the in-app prompt fire: the app reads
      # `releases/latest`, which only ever returns a published, non-draft,
      # non-pre-release release. A run that stopped at the artifact would leave
      # every installed copy unaware of it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          notes="${{ steps.notes.outputs.file }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — replacing its assets and notes."
            gh release upload "$tag" dist/*.apk --clobber
            gh release edit "$tag" --title "Lossless ${version}" --notes-file "$notes"
          else
            gh release create "$tag" dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "Lossless ${version}" \
              --notes-file "$notes" \
              --latest
          fi
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"
