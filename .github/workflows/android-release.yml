name: Build signed Lossless release APK

# Optional, and separate from android-debug.yml on purpose: this one runs R8,
# which is the difference between an APK that scrolls smoothly and one that
# doesn't. The debug workflow stays as it was, so if this one trips over a keep
# rule the debug build is untouched.
#
# Needs the same two repository secrets as the debug workflow
# (LSY_FREE_KEYSTORE_BASE64, LSY_FREE_KEYSTORE_PASSWORD). The keystore they hold
# is a PKCS12 whose key alias is `lsy-free` — the pre-rebrand spelling, kept
# because the key already exists and changing it would change the signature
# every install was signed with.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle signing config reads keystore.properties from the project
      # root; it and the keystore are both gitignored, so they only exist for
      # the length of this job.
      - name: Stage the signing key
        env:
          LSY_FREE_KEYSTORE_BASE64: ${{ secrets.LSY_FREE_KEYSTORE_BASE64 }}
          LSY_FREE_KEYSTORE_PASSWORD: ${{ secrets.LSY_FREE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$LSY_FREE_KEYSTORE_BASE64" ] || [ -z "$LSY_FREE_KEYSTORE_PASSWORD" ]; then
            echo '::error::Add LSY_FREE_KEYSTORE_BASE64 and LSY_FREE_KEYSTORE_PASSWORD as repository Actions secrets before building.'
            exit 1
          fi
          umask 077
          printf '%s' "$LSY_FREE_KEYSTORE_BASE64" | base64 --decode > lossless-ci.p12
          keytool -list -keystore lossless-ci.p12 -storetype PKCS12 -alias lsy-free \
            -storepass:env LSY_FREE_KEYSTORE_PASSWORD > /dev/null
          {
            echo 'storeFile=lossless-ci.p12'
            echo "storePassword=$LSY_FREE_KEYSTORE_PASSWORD"
            echo 'keyAlias=lsy-free'
            echo "keyPassword=$LSY_FREE_KEYSTORE_PASSWORD"
          } > keystore.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDKs and native tools
        run: |
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'

      - name: Build a signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease \
            --no-daemon --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify the signature
        env:
          LSY_FREE_KEYSTORE_PASSWORD: ${{ secrets.LSY_FREE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/prod/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo '::error::No APKs were generated.'
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Lossless-release-APKs
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
