<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <title>Lossless</title>
  <defs>
    <linearGradient id="wave" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8AEFF"/>
    </linearGradient>
  </defs>
  <!-- vinyl disc -->
  <circle cx="54" cy="54" r="40" fill="#11101A"/>
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="0.9" fill="none">
    <circle cx="54" cy="54" r="37"/><circle cx="54" cy="54" r="32"/>
    <circle cx="54" cy="54" r="27"/><circle cx="54" cy="54" r="22"/>
  </g>
  <path d="M24 42 A40 40 0 0 1 72 24" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- audio waveform etched on the disc -->
  <g fill="url(#wave)">
    <rect x="35.5" y="49" width="3.4" height="10" rx="1.7"/>
    <rect x="41.1" y="42" width="3.4" height="24" rx="1.7"/>
    <rect x="46.7" y="39" width="3.4" height="30" rx="1.7"/>
    <rect x="52.3" y="45" width="3.4" height="18" rx="1.7"/>
    <rect x="57.9" y="39" width="3.4" height="30" rx="1.7"/>
    <rect x="63.5" y="42" width="3.4" height="24" rx="1.7"/>
    <rect x="69.1" y="49" width="3.4" height="10" rx="1.7"/>
  </g>
</svg>
