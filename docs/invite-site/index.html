<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a10">
  <title>Lossless</title>
  <meta name="description" content="Lossless — an Android music player with Listen Together parties and LastWave add-on support.">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center; background: #080a10; color: #f4f4f6; font-family: system-ui, -apple-system, sans-serif; }
    main { width: min(100%, 440px); line-height: 1.6; }
    .brand { color: #b6a5ff; font-weight: 700; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; line-height: 1.15; }
    p { color: #b8bdca; }
    .button { display: block; margin-top: 22px; padding: 15px; border-radius: 12px; color: #10101a; background: #c0b0ff; text-decoration: none; font-weight: 750; text-align: center; }
    .button:hover, .button:focus-visible { background: #d3c9ff; outline: 2px solid white; outline-offset: 3px; }
    .small { font-size: .88rem; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Lossless</div>
    <h1>An Android music player.</h1>
    <p>Local files, Listen Together parties, and add-on streaming — with Lossless and the LastWave HTTP add-on protocol.</p>
    <a class="button" href="https://github.com/daddyyour0786-dev/Lossless">Get Lossless on GitHub</a>
    <p class="small">Android 12 and newer. Invitations sent to you open at <code>/invite/?code=…</code>.</p>
  </main>
</body>
</html>
